// Top-level build file where you can add configuration options common to all sub-projects/modules.


buildscript {
    ext.SAMPLE_HOST_APP_APPLICATION_ID = 'com.awell.launcher'

    repositories {
        maven {
            url = './libs/maven'   // 或者使用绝对路径，但相对路径更易于移植
        }
        mavenLocal()
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }

    ext.kotlin_version = '1.9.24' // 统一使用这个版本
    ext.coroutines_version = "1.7.3"

    ext {
        // 定义共享的宿主app包名和启动activity
        hostApplicationId = "com.awell.launcher.host"
        hostAppLauncherActivity = "com.awell.launcher.host.MainActivity"
    }

    dependencies {
        classpath "com.android.tools.build:gradle:7.4.2"

        // 其他依赖...
//        classpath "com.tencent.shadow:aar-to-jar-plugin:1.0" // 替换成你发布的版本
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
//        classpath 'com.tencent.shadow.core:gradle-plugin:1.0'

        classpath libs.replugin.host.gradle
        classpath libs.replugin.plugin.gradle

    }
}


static def log(message) {
    System.err.println ">>> [DEBUG] [huang] ${new Date().format('HH:mm:ss.SSS')} ${message}"
}

plugins {
    id 'com.android.application' version '7.4.0' apply false
    id 'com.android.library' version '7.4.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}


def getTargetDirName(String moduleName) {
    def nameMap = [
            'launcher': 'LauncherHost',
            'plugin1' : 'LauncherUI1',
            'plugin2' : 'LauncherUI2',
            'ui3'     : 'LauncherUI3',
            'ui4'     : 'LauncherUI4',
            'ui5'     : 'LauncherUI5',
            'ui6'     : 'LauncherUI6',
            'ui7'     : 'LauncherUI7',
            'ui8'     : 'LauncherUI8',
            'ui9'     : 'LauncherUI9',
            'ui10'    : 'LauncherUI10',
            'yfd_ui01': 'LauncherYFD01',
            'gongban' : 'LauncherGongban'
            // 其他模块可以继续添加映射
    ]
    return nameMap.get(moduleName, moduleName)
}


// 创建复制所有模块APK到统一目录的任务
task copyAllReleaseApks(type: Copy) {
    // 清空目标目录
    delete rootProject.projectDir.path + '/release'

    // 为每个模块创建复制规则
    subprojects { subproject ->
        def targetDirName = getTargetDirName(subproject.name)
        from(subproject.projectDir.path + '/build/outputs/apk/release') {
            include '*.apk'
            into targetDirName
        }
    }
    into rootProject.projectDir.path + '/release'
}

def releaseTasks = []

// 监听所有任务的添加
subprojects { subproject ->
    subproject.tasks.whenTaskAdded { task ->
        if (task.name == 'assembleRelease') {
            println ">>> Task added: ${subproject.name}:${task.name}"
            releaseTasks.add(task)
        }
    }
}


task assembleAllRelease {
    // 依赖关系在 whenTaskAdded 中动态添加
}


// 所有插件模块共享的 Glide annotationProcessor 配置
// 排除不含 Glide 注解的模块（AwellLibrary、launcher host 等）
subprojects { subproject ->
    if (subproject.name in ['AwellLibrary', 'launcher', 'app']) return
    plugins.whenPluginAdded { plugin ->
        if (plugin.class.name == 'com.android.build.gradle.LibraryPlugin' ||
            plugin.class.name == 'com.android.build.gradle.AppPlugin' ||
            plugin.class.name == 'com.android.build.gradle.api.AndroidBasePlugin') {
            subproject.dependencies.add('annotationProcessor', 'com.github.bumptech.glide:compiler:4.16.0')
        }
    }
}

afterEvaluate {
    assembleAllRelease.dependsOn(releaseTasks)
    assembleAllRelease.finalizedBy copyAllReleaseApks
}
