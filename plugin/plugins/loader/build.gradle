apply plugin: 'com.android.application'

android {
    compileSdkVersion project.COMPILE_SDK_VERSION
    namespace "com.tencent.shadow.sample.plugin.loader"
    defaultConfig {
        applicationId project.SAMPLE_HOST_APP_APPLICATION_ID
        minSdkVersion project.MIN_SDK_VERSION
        targetSdkVersion project.TARGET_SDK_VERSION
        versionCode project.VERSION_CODE
        versionName project.VERSION_NAME
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            variant.outputs.all { output ->
                output.outputFileName = "${project.name}-${variant.buildType.name}.apk"
            }
            // 2. 在构建完成后复制文件（不修改原始输出目录）
            variant.assembleProvider.get().doLast {
                // 原始输出目录
                def sourceDir = variant.packageApplicationProvider.get().outputDirectory.get().asFile

                // 目标目录（您想要的副本位置）
                def targetDir = new File("${project.buildDir}/outputs/apk/release")
                if (!targetDir.exists()) targetDir.mkdirs()
                // 复制所有APK文件
                copy {
                    from sourceDir
                    include "*.apk"
                    into targetDir
                }

                // 复制元数据文件（解决原始错误）
                copy {
                    from sourceDir
                    include "output-metadata.json"
                    into targetDir
                }
                println "Copied release APK to: ${targetDir.absolutePath}"
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('../../../keystore/platform.jks')
            keyAlias 'platform'
            keyPassword 'android'
            storePassword 'android'
        }
        release {
            storeFile file('../../../keystore/platform.jks')
            keyAlias 'platform'
            keyPassword 'android'
            storePassword 'android'
        }
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            signingConfig signingConfigs.release
            signingConfig.initWith(buildTypes.debug.signingConfig)
        }
    }
}

dependencies {
    implementation 'com.tencent.shadow.core:loader:1.0'
    implementation 'com.tencent.shadow.dynamic:loader:1.0'
    implementation 'com.tencent.shadow.dynamic:loader-impl:1.0'
    implementation project(':plugin:plugins:constant')

    compileOnly 'com.tencent.shadow.core:runtime:1.0'
    compileOnly 'com.tencent.shadow.core:activity-container:1.0'
    compileOnly 'com.tencent.shadow.core:common:1.0'
    //下面这行依赖是为了防止在proguard的时候找不到LoaderFactory接口
    compileOnly 'com.tencent.shadow.dynamic:host:1.0'

    compileOnly files("${project(":plugin:plugins:host-lib").getBuildDir()}/outputs/jar/sample-host-lib-debug.jar")
}

preBuild.dependsOn(":plugins:sample-host-lib:jarDebugPackage")
