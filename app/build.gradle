dependencies {

    implementation project(':plugin:plugins:host-lib')
    implementation project(':plugin:plugins:constant')

    //implementation files('libs\\kwmusic.jar')
    //compileOnly files('libs\\mlibrary.jar')
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation project(path: ':AwellLibrary')
    implementation 'androidx.media:media:1.6.0'  // ���°汾���ܲ�ͬ
    implementation 'androidx.core:core-ktx:1.10.1'  // �����ҪKotlin��չ


    constraints {
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android") {
            version { strictly("1.7.3") } // Kotlin 1.9.x官方推荐协程版本
        }
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core") {
            version { strictly("1.7.3") }
        }
    }
    implementation("androidx.lifecycle:lifecycle-common:2.6.1") // 保持原版本
    implementation 'androidx.activity:activity:1.7.1'

    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.1'
