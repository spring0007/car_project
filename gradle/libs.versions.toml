[versions]
kotlinxCoroutinesAndroid = "1.7.3"
appcompat = "1.6.1"
constraintlayout = "2.1.0"
media = "1.6.0"
okhttp3Integration = "4.16.0"
repluginPlugin = "3.1.0"
recyclerview = "1.1.0"
agp = "7.4.0"
kotlin = "1.9.24"
localbroadcastmanager = "1.0.0"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
localbroadcastmanager = { module = "androidx.localbroadcastmanager:localbroadcastmanager", version.ref = "localbroadcastmanager" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
media = { module = "androidx.media:media", version.ref = "media" }
okhttp3-integration = { module = "com.github.bumptech.glide:okhttp3-integration", version.ref = "okhttp3Integration" }
replugin-host-gradle = { module = "com.qihoo360.replugin:replugin-host-gradle", version.ref = "repluginPlugin" }
replugin-host-lib = { module = "com.qihoo360.replugin:replugin-host-lib", version.ref = "repluginPlugin" }
replugin-plugin-gradle = { module = "com.qihoo360.replugin:replugin-plugin-gradle", version.ref = "repluginPlugin" }
replugin-plugin-lib = { module = "com.qihoo360.replugin:replugin-plugin-lib", version.ref = "repluginPlugin" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

